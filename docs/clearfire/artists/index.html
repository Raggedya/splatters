 const grid=document.getElementById('creators');
 const shuffle=document.querySelector('.gallery-shuffle');
 const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
 const limit=24;
 let activeMotion=null;
 let tiles=[...grid.children];

 function updateShuffle(){
  shuffle.setAttribute('aria-disabled',String(tiles.length<2||activeMotion!==null));
 }

 function stopMotion(){
  const motion=activeMotion;
  activeMotion=null;
  for(const animation of motion||[])animation.cancel();
  grid.inert=false;
  updateShuffle();
 }

 function reordered(tiles){
  const result=[...tiles];
  for(let i=result.length-1;i>0;i--){
   const j=Math.floor(Math.random()*(i+1));
   [result[i],result[j]]=[result[j],result[i]];
  }
  if(result.length>1&&result.every((tile,index)=>tile===tiles[index])){
   result.push(result.shift());
  }
  return result;
 }

 shuffle.addEventListener('click',()=>{
  if(tiles.length<2||activeMotion)return;
  const animate=!reducedMotion.matches&&typeof grid.animate==='function';
  const before=new Map(animate?tiles.map(tile=>[tile,tile.getBoundingClientRect()]):[]);
  const onScreen=animate&&tiles.length>limit?tiles.filter(tile=>{
   const rect=before.get(tile);
   return rect.bottom>0&&rect.top<innerHeight;
  }):[];
  let next;
  if(onScreen.length>1){
   // Keep the visible frames within their current screenful while shuffling the rest independently.
   const onScreenSet=new Set(onScreen);
   const near=reordered(onScreen).values();
   const far=reordered(tiles.filter(tile=>!onScreenSet.has(tile))).values();
   next=tiles.map(tile=>(onScreenSet.has(tile)?near:far).next().value);
  }else next=reordered(tiles);
  grid.append(...next);
  tiles=next;
  if(!animate)return;

  const moves=[];
  for(const tile of tiles){
   const old=before.get(tile),current=tile.getBoundingClientRect();
   if((old.bottom<=0&&current.bottom<=0)||(old.top>=innerHeight&&current.top>=innerHeight))continue;
   const x=old.left-current.left,y=old.top-current.top;
   if((x||y)&&Math.abs(y)<innerHeight)moves.push({tile,x,y});
   if(moves.length===limit)break;
  }
  if(!moves.length)return;
  grid.inert=true;
  const motion=moves.map(({tile,x,y})=>tile.animate([
   {transform:'translate('+x+'px,'+y+'px)'},{transform:'translate(0,0)'}
  ],{duration:900,easing:'cubic-bezier(.42,0,.28,1)'}));
  activeMotion=motion;
  updateShuffle();
  Promise.allSettled(motion.map(animation=>animation.finished)).then(()=>{
   if(activeMotion===motion)stopMotion();
  });
 });

 reducedMotion.addEventListener('change',event=>{if(event.matches&&activeMotion)stopMotion();});
 updateShuffle();
 shuffle.hidden=false;
})();
