></li><li><a href="../redinc/" aria-label="REDinc"><div class="artwork"><img src="../redinc/gallery-thumbnail-91bf1e018f59edb2575919e1dc6f7a1830d92c69bd2ff792be17c7b7c08eda25.webp" alt="" width="480" height="480" loading="lazy" decoding="async"></div><span class="nameplate"><span class="nameplate-label" aria-hidden="true"><span class="nameplate-line">REDinc</span></span></span></a></li><li><a href="../studio-a/" aria-label="Studio A"><div class="artwork"><img src="../studio-a/gallery-thumbnail-12760c6847543ab7e343a632da30e046fef110342188c58972e8674874fbf007.webp" alt="" width="480" height="480" loading="lazy" decoding="async"></div><span class="nameplate"><span class="nameplate-label" aria-hidden="true"><span class="nameplate-line">Studio A</span></span></span></a></li><li><a href="../studio-artes/" aria-label="Studio ARTES"><div class="artwork"><img src="../studio-artes/gallery-thumbnail-9cefd5a50b483325cf8cbcb99f8256f07b5cf21c0483b1207854d09447b631a8.webp" alt="" width="480" height="480" loading="lazy" decoding="async"></div><span class="nameplate"><span class="nameplate-label" aria-hidden="true"><span class="nameplate-line">Studio ARTES</span></span></span></a></li><li><a href="../tutti-arts/" aria-label="Tutti Arts"><div class="artwork"><img src="../tutti-arts/gallery-thumbnail-137724ea586cc0951ed06b12ce8368782beb739fc4e9bec683f75487a2b5e2e4.webp" alt="" width="480" height="480" loading="lazy" decoding="async"></div><span class="nameplate"><span class="nameplate-label" aria-hidden="true"><span class="nameplate-line">Tutti Arts</span></span></span></a></li></ul></main><script>(() => {
 const grid=document.getElementById('creators');
 const shuffle=document.querySelector('.gallery-shuffle');
 const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
 const limit=24;
 let activeMotion=null;
 let tiles=[...grid.children];

 function updateShuffle(){
  shuffle.setAttribute('aria-disabled',String(tiles.length<2||activeMotion!==null));
 }

 function stopMotion(){
  const motion=activeMotion;
  activeMotion=null;
  for(const animation of motion||[])animation.cancel();
  grid.inert=false;
  updateShuffle();
 }

 function reordered(tiles){
  const result=[...tiles];
  for(let i=result.length-1;i>0;i--){
   const j=Math.floor(Math.random()*(i+1));
   [result[i],result[j]]=[result[j],result[i]];
  }
  if(result.length>1&&result.every((tile,index)=>tile===tiles[index])){
   result.push(result.shift());
  }
  return result;
 }

 shuffle.addEventListener('click',()=>{
  if(tiles.length<2||activeMotion)return;
  const animate=!reducedMotion.matches&&typeof grid.animate==='function';
  const before=new Map(animate?tiles.map(tile=>[tile,tile.getBoundingClientRect()]):[]);
  const onScreen=animate&&tiles.length>limit?tiles.filter(tile=>{
   const rect=before.get(tile);
   return rect.bottom>0&&rect.top<innerHeight;
  }):[];
  let next;
  if(onScreen.length>1){
   // Keep the visible frames within their current screenful while shuffling the rest independently.
   const onScreenSet=new Set(onScreen);
   const near=reordered(onScreen).values();
   const far=reordered(tiles.filter(tile=>!onScreenSet.has(tile))).values();
   next=tiles.map(tile=>(onScreenSet.has(tile)?near:far).next().value);
  }else next=reordered(tiles);
  grid.append(...next);
  tiles=next;
  if(!animate)return;

  const moves=[];
  for(const tile of tiles){
   const old=before.get(tile),current=tile.getBoundingClientRect();
   if((old.bottom<=0&&current.bottom<=0)||(old.top>=innerHeight&&current.top>=innerHeight))continue;
   const x=old.left-current.left,y=old.top-current.top;
   if((x||y)&&Math.abs(y)<innerHeight)moves.push({tile,x,y});
   if(moves.length===limit)break;
  }
  if(!moves.length)return;
  grid.inert=true;
  const motion=moves.map(({tile,x,y})=>tile.animate([
   {transform:'translate('+x+'px,'+y+'px)'},{transform:'translate(0,0)'}
  ],{duration:900,easing:'cubic-bezier(.42,0,.28,1)'}));
  activeMotion=motion;
  updateShuffle();
  Promise.allSettled(motion.map(animation=>animation.finished)).then(()=>{
   if(activeMotion===motion)stopMotion();
  });
 });

 reducedMotion.addEventListener('change',event=>{if(event.matches&&activeMotion)stopMotion();});
 updateShuffle();
 shuffle.hidden=false;
})();
